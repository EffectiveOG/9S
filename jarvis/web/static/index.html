<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Control Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <!-- Login gate -->
    <div id="loginOverlay" class="fixed inset-0 bg-gray-800 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg p-8 w-80">
            <h1 class="text-2xl font-bold mb-6 text-gray-800">Jarvis Login</h1>
            <div class="space-y-3">
                <input id="username" type="text" placeholder="Username" autocomplete="username"
                       class="w-full p-2 border rounded" value="admin">
                <input id="password" type="password" placeholder="Password" autocomplete="current-password"
                       class="w-full p-2 border rounded">
                <p id="loginError" class="text-red-500 text-sm hidden">Invalid username or password</p>
                <button onclick="login()"
                        class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Sign in
                </button>
            </div>
        </div>
    </div>

    <div id="app" class="container mx-auto px-4 py-8 hidden">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-4xl font-bold text-gray-800">Jarvis Control Interface</h1>
            <button onclick="logout()" class="text-sm text-gray-500 hover:text-gray-800">Sign out</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">System Status</h2>
                <div id="systemStatus" class="space-y-2">
                    <p>Status: <span id="status" class="font-medium">Loading...</span></p>
                    <p>Uptime: <span id="uptime" class="font-medium">0s</span></p>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Components</h2>
                <div id="components" class="space-y-2"></div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Scenes</h2>
                <div id="scenes" class="space-y-2"></div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Devices</h2>
                <div id="devices" class="space-y-4"></div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Command Console</h2>
                <div class="space-y-4">
                    <textarea id="commandInput" class="w-full h-24 p-2 border rounded"
                              placeholder='{"type": "system_control", "data": {"action": "status"}}'></textarea>
                    <button onclick="sendCommand()"
                            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                        Send Command
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Event Log</h2>
                <div id="eventLog" class="h-48 overflow-y-auto space-y-2 text-sm"></div>
            </div>

            <!-- Face library (Frigate-style): people, their images, recent faces to train -->
            <div class="bg-white rounded-lg shadow p-6 md:col-span-2 lg:col-span-3">
                <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
                    <h2 class="text-xl font-semibold">Faces</h2>
                    <div class="flex gap-2">
                        <input id="newPersonName" type="text" placeholder="New person name"
                               class="p-2 border rounded text-sm" maxlength="64">
                        <button onclick="createPerson()"
                                class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">Add person</button>
                        <button onclick="loadFaces()"
                                class="bg-gray-200 px-3 py-1 rounded text-sm hover:bg-gray-300">Refresh</button>
                    </div>
                </div>
                <p id="facesMessage" class="text-sm mb-3 hidden"></p>
                <div id="facePeople" class="space-y-4"></div>
                <h3 class="text-lg font-semibold mt-6 mb-2">Recent faces <span class="text-sm font-normal text-gray-500">— assign them to a person to improve recognition</span></h3>
                <div id="faceAttempts" class="flex flex-wrap gap-3"></div>
            </div>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------------
        // Auth state (in-memory only; token is never persisted to storage)
        // ------------------------------------------------------------------
        let authToken = null;
        let ws = null;

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('loginError');
            errEl.classList.add('hidden');
            try {
                const res = await fetch('/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username, password })
                });
                if (!res.ok) { errEl.classList.remove('hidden'); return; }
                const data = await res.json();
                authToken = data.access_token;
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                start();
            } catch (e) {
                errEl.classList.remove('hidden');
            }
        }

        function logout() {
            authToken = null;
            if (ws) { ws.close(); ws = null; }
            document.getElementById('app').classList.add('hidden');
            document.getElementById('loginOverlay').classList.remove('hidden');
        }

        // Fetch wrapper that attaches the bearer token and handles expiry.
        async function authFetch(url, opts = {}) {
            opts.headers = Object.assign({}, opts.headers, {
                'Authorization': 'Bearer ' + authToken
            });
            const res = await fetch(url, opts);
            if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
            return res;
        }

        function start() {
            connectWebSocket();
            loadStatus();
            loadScenes();
            loadFaces();
        }

        function connectWebSocket() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws`);
            // The server expects the token as the first message.
            ws.onopen = () => ws.send(JSON.stringify({ token: authToken }));
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg && msg.system) updateDashboard(msg);   // state broadcast
                // (metrics/command_response messages are ignored here)
            };
            ws.onclose = () => { /* connection closed */ };
        }

        function updateDashboard(state) {
            document.getElementById('status').textContent = state.system.status;
            document.getElementById('uptime').textContent =
                `${Math.floor(state.system.uptime || 0)}s`;

            const componentsDiv = document.getElementById('components');
            componentsDiv.innerHTML = '';
            Object.entries(state.system.components || {}).forEach(([name, status]) => {
                const color = status === 'healthy' ? 'text-green-500' : 'text-red-500';
                componentsDiv.innerHTML +=
                    `<div class="flex justify-between items-center">
                        <span>${name}</span><span class="${color}">${status}</span></div>`;
            });

            const devicesDiv = document.getElementById('devices');
            devicesDiv.innerHTML = '';
            Object.entries(state.devices || {}).forEach(([id, deviceState]) => {
                devicesDiv.innerHTML +=
                    `<div class="border rounded p-3"><h3 class="font-medium">${id}</h3>
                     <pre class="text-sm mt-2">${JSON.stringify(deviceState, null, 2)}</pre></div>`;
            });

            if (state.last_event && state.last_event.type) {
                const eventLog = document.getElementById('eventLog');
                const eventDiv = document.createElement('div');
                eventDiv.className = 'p-2 bg-gray-50 rounded';
                eventDiv.textContent = `${state.last_event.type} from ${state.last_event.sender}`;
                eventLog.prepend(eventDiv);
                while (eventLog.children.length > 50) eventLog.removeChild(eventLog.lastChild);
            }
        }

        function sendCommand() {
            const commandInput = document.getElementById('commandInput');
            try {
                const command = JSON.parse(commandInput.value);
                // Server expects a typed envelope over the WebSocket.
                ws.send(JSON.stringify({ type: 'command', data: command }));
                commandInput.value = '';
            } catch (e) {
                alert('Invalid command format. Please enter valid JSON.');
            }
        }

        async function loadStatus() {
            try {
                const res = await authFetch('/api/status');
                const data = await res.json();
                updateDashboard({
                    system: { status: data.status, uptime: data.uptime, components: data.components },
                    devices: {}, last_event: data.last_event
                });
            } catch (e) { /* handled by authFetch */ }
        }

        async function loadScenes() {
            try {
                const res = await authFetch('/api/scenes');
                const data = await res.json();
                const scenesDiv = document.getElementById('scenes');
                scenesDiv.innerHTML = '';
                (data.scenes || []).forEach(scene => {
                    const button = document.createElement('button');
                    button.className = 'bg-gray-200 px-3 py-1 rounded mr-2 mb-2 hover:bg-gray-300';
                    button.textContent = scene;
                    button.onclick = () => activateScene(scene);
                    scenesDiv.appendChild(button);
                });
            } catch (e) { /* handled by authFetch */ }
        }

        async function activateScene(scene) {
            try {
                const res = await authFetch(`/api/scenes/${scene}/activate`, { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') console.log(`Scene ${scene} activated`);
            } catch (e) { /* handled by authFetch */ }
        }

        // ------------------------------------------------------------------
        // Face library. Built with DOM APIs + textContent (no innerHTML) since
        // names and file names come from the server / user input.
        // ------------------------------------------------------------------
        let facePeople = {};
        const thumbUrls = [];

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function button(label, cls, onclick) {
            const b = el('button', cls + ' px-2 py-1 rounded text-xs', label);
            b.onclick = onclick;
            return b;
        }

        function facesMessage(text, ok) {
            const m = document.getElementById('facesMessage');
            m.textContent = text;
            m.className = 'text-sm mb-3 ' + (ok ? 'text-green-600' : 'text-red-600');
            clearTimeout(m._t);
            m._t = setTimeout(() => m.classList.add('hidden'), 6000);
        }

        async function faceApi(url, opts = {}) {
            const res = await authFetch(url, opts);
            let data = {};
            try { data = await res.json(); } catch (e) { /* empty body */ }
            if (!res.ok) throw new Error(data.detail || res.statusText);
            return data;
        }

        function jsonOpts(method, body) {
            return { method, headers: { 'Content-Type': 'application/json' },
                     body: JSON.stringify(body || {}) };
        }

        async function thumb(url, title) {
            const img = el('img', 'w-20 h-20 object-cover rounded border');
            img.title = title || '';
            try {
                const res = await authFetch(url);
                if (res.ok) {
                    const u = URL.createObjectURL(await res.blob());
                    thumbUrls.push(u);
                    img.src = u;
                }
            } catch (e) { /* ignore */ }
            return img;
        }

        async function loadFaces() {
            let data;
            try { data = await faceApi('/api/faces'); }
            catch (e) {
                document.getElementById('facePeople').textContent = 'Face recognition not available.';
                return;
            }
            thumbUrls.splice(0).forEach(u => URL.revokeObjectURL(u));
            facePeople = data.people || {};
            renderPeople();
            renderAttempts(data.attempts || []);
        }

        function renderPeople() {
            const root = document.getElementById('facePeople');
            root.replaceChildren();
            const names = Object.keys(facePeople);
            if (!names.length) root.appendChild(el('p', 'text-gray-500 text-sm', 'No known faces yet.'));
            names.forEach(name => {
                const card = el('div', 'border rounded p-3');
                const head = el('div', 'flex flex-wrap items-center gap-2 mb-2');
                head.appendChild(el('span', 'font-medium mr-2', `${name} (${facePeople[name].length})`));
                head.appendChild(button('Capture from camera', 'bg-blue-500 text-white hover:bg-blue-600',
                                        () => enrollFromCamera(name)));
                const upload = el('input'); upload.type = 'file'; upload.accept = 'image/*';
                upload.className = 'hidden';
                upload.onchange = () => uploadFace(name, upload.files[0]);
                head.appendChild(button('Upload image', 'bg-gray-200 hover:bg-gray-300', () => upload.click()));
                head.appendChild(upload);
                head.appendChild(button('Rename', 'bg-gray-200 hover:bg-gray-300', () => renamePerson(name)));
                head.appendChild(button('Delete', 'bg-red-100 text-red-700 hover:bg-red-200', () => deletePerson(name)));
                card.appendChild(head);
                const imgs = el('div', 'flex flex-wrap gap-2');
                facePeople[name].forEach(async file => {
                    const wrap = el('div', 'relative');
                    wrap.appendChild(await thumb(`/api/faces/${encodeURIComponent(name)}/${encodeURIComponent(file)}`, file));
                    const x = button('×', 'absolute top-0 right-0 bg-white bg-opacity-80 text-red-600',
                                     () => deleteFaceImage(name, file));
                    wrap.appendChild(x);
                    imgs.appendChild(wrap);
                });
                card.appendChild(imgs);
                root.appendChild(card);
            });
        }

        function renderAttempts(attempts) {
            const root = document.getElementById('faceAttempts');
            root.replaceChildren();
            if (!attempts.length) root.appendChild(el('p', 'text-gray-500 text-sm', 'No recent faces.'));
            attempts.forEach(async a => {
                const card = el('div', 'border rounded p-2 text-xs w-32');
                card.appendChild(await thumb(`/api/faces/train/${encodeURIComponent(a.file)}`, a.file));
                const label = a.identity === 'unknown' ? 'Unknown' : `${a.identity} ${Math.round(a.score * 100)}%`;
                card.appendChild(el('div', 'mt-1 ' + (a.identity === 'unknown' ? 'text-gray-500' : 'text-green-700'), label));
                card.appendChild(el('div', 'text-gray-400', new Date(a.timestamp * 1000).toLocaleString()));
                const select = el('select', 'w-full border rounded mt-1');
                select.appendChild(el('option', '', 'Assign to…'));
                Object.keys(facePeople).forEach(n => {
                    const o = el('option', '', n); o.value = n; select.appendChild(o);
                });
                select.onchange = () => select.value && trainAttempt(a.file, select.value);
                card.appendChild(select);
                card.appendChild(button('Delete', 'mt-1 w-full bg-gray-100 hover:bg-gray-200', () => deleteAttempt(a.file)));
                root.appendChild(card);
            });
        }

        async function faceAction(promise, okText) {
            try { await promise; facesMessage(okText, true); }
            catch (e) { facesMessage(e.message, false); }
            loadFaces();
        }

        function createPerson() {
            const input = document.getElementById('newPersonName');
            const name = input.value.trim();
            if (!name) return;
            input.value = '';
            faceAction(faceApi(`/api/faces/${encodeURIComponent(name)}/create`, { method: 'POST' }),
                       `${name} added — capture or upload a few images.`);
        }

        function enrollFromCamera(name) {
            facesMessage(`Look at the camera… capturing ${name}`, true);
            faceAction(faceApi(`/api/faces/${encodeURIComponent(name)}/enroll`, jsonOpts('POST', { samples: 5 })),
                       `Images captured for ${name}.`);
        }

        function uploadFace(name, file) {
            if (!file) return;
            const form = new FormData();
            form.append('file', file);
            faceAction(faceApi(`/api/faces/${encodeURIComponent(name)}/register`, { method: 'POST', body: form }),
                       `Image added to ${name}.`);
        }

        function renamePerson(name) {
            const newName = prompt(`Rename ${name} to:`, name);
            if (!newName || newName === name) return;
            faceAction(faceApi(`/api/faces/${encodeURIComponent(name)}/rename`, jsonOpts('PUT', { new_name: newName })),
                       `${name} renamed to ${newName}.`);
        }

        function deletePerson(name) {
            if (!confirm(`Delete ${name} and all their images?`)) return;
            faceAction(faceApi(`/api/faces/${encodeURIComponent(name)}`, { method: 'DELETE' }), `${name} deleted.`);
        }

        function deleteFaceImage(name, file) {
            if (!confirm('Delete this image?')) return;
            faceAction(faceApi(`/api/faces/${encodeURIComponent(name)}/delete`, jsonOpts('POST', { ids: [file] })),
                       'Image deleted.');
        }

        function trainAttempt(file, name) {
            faceAction(faceApi(`/api/faces/train/${encodeURIComponent(name)}/classify`,
                               jsonOpts('POST', { training_file: file })), `Face assigned to ${name}.`);
        }

        function deleteAttempt(file) {
            faceAction(faceApi('/api/faces/train/delete', jsonOpts('POST', { ids: [file] })), 'Recent face deleted.');
        }

        // Allow Enter key to submit the login form.
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('loginOverlay').classList.contains('hidden')) {
                login();
            }
        });
    </script>
</body>
</html>
